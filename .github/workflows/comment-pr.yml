name: Comment Registry PR

on:
  workflow_run:
    workflows: ["Validate Registry PR"]
    types: [completed]

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pull-requests: write

    steps:
      # Checks out the default branch, never the PR code.
      - uses: actions/checkout@v7

      - name: Download PR comment
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pr-comment
          path: pr-comment/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const script = require('./.github/scripts/comment-pr.js');
            await script({ github, context, dir: 'pr-comment' });
