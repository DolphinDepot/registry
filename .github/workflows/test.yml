name: Test Registry Tooling

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
  pull_request:
    paths:
      - "scripts/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      - run: npm test
